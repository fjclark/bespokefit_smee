name: Publish Documentation

on:
  push:
    branches: ["main"]
    tags: ["*"]

concurrency:
  group: publish-documentation
  cancel-in-progress: false

jobs:
  deploy-docs:

    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Classify release tag
      id: release
      if: github.ref_type == 'tag'
      run: python .github/scripts/release_tags.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

    - name: Determine Version
      shell: bash
      env:
        IS_VERSION: ${{ steps.release.outputs.is_version }}
        IS_LATEST: ${{ steps.release.outputs.is_latest }}
      run: |
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          echo "VERSION=latest" >> "$GITHUB_ENV"
        elif [ "$IS_VERSION" = "true" ]; then
          if [ "$IS_LATEST" = "true" ]; then
            echo "VERSION=$GITHUB_REF_NAME stable" >> "$GITHUB_ENV"
          else
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
        else
          echo "Skipping non-version tag: $GITHUB_REF_NAME"
        fi

    - uses: prefix-dev/setup-pixi@v0.10.2
      if: github.ref_type != 'tag' || steps.release.outputs.is_version == 'true'
      with:
        pixi-version: v0.67.2
        cache: true
        environments: cpu-py312 # Use Python 3.12 for documentation deployment as 3.13 needs to build dm-tree from source

    - name: Build and Deploy Documentation
      if: github.ref_type != 'tag' || steps.release.outputs.is_version == 'true'
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git config --global --add safe.directory "$PWD"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

        git fetch --all --prune

        pixi run -e cpu-py312 docs-deploy VERSION="$VERSION"
