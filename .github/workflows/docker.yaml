name: Publish Docker Image

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (published as test-<suffix>)"
        default: "test"
        required: true

concurrency:
  group: publish-docker-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify release tag
        id: release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python .github/scripts/release_tags.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && steps.release.outputs.is_version == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && steps.release.outputs.is_series_latest == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && steps.release.outputs.is_latest == 'true' }}
            type=raw,value=test-${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        if: github.event_name != 'push' || github.ref_type != 'tag' || steps.release.outputs.is_version == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # hatch-vcs cannot read the version from git inside the build, because
          # .git is excluded from the build context. Hand it in instead.
          build-args: |
            PRESTO_VERSION=${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '0.0.0.dev0' }}
          # Do not export a BuildKit cache to type=gha: its large Pixi layers would
          # compete with ci.yaml's Pixi caches for the repo's Actions cache quota.
          provenance: false

      - name: Report disk usage
        if: always()
        run: df -h /
