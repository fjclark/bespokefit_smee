name: Publish Docker Image

on:
  push:
    tags: ["*"]
    # TEMPORARY: lets this branch exercise the workflow before it reaches main,
    # where workflow_dispatch first becomes available. Remove before merging.
    branches: ["feature-docker"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (test builds)"
        default: "test"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # TEMPORARY: pairs with the feature-docker push trigger above, so a
            # branch build has a tag to push as. Remove both together before merge.
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # hatch-vcs cannot read the version from git inside the build, because
          # .git is excluded from the build context. Hand it in instead.
          build-args: |
            PRESTO_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0.dev0' }}
          # No cache-from/cache-to: the Actions cache is capped at 10 GB per repo
          # and this image alone would evict the pixi cache that ci.yaml relies on.
          provenance: false

      - name: Report disk usage
        if: always()
        run: df -h /
