[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "presto"
description = "Fast parameterisation of bespoke MM force fields using MLPs."
authors = [
  {name = "Finlay Clark"},
  {name = "Thomas Pope"}
]
license = { text = "MIT" }
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

[project.scripts]
presto = "presto._cli:run_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["presto"]
include = ["presto/models/*.pt"]

[tool.ruff.lint]
ignore = ["C901", "E501"]
select = ["B", "B9", "C", "C4", "D", "E","F", "NPY", "RUF", "UP", "W"]
ignore-init-module-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
omit = ["**/tests/*", "**/_version.py"]

[tool.mypy]
plugins = "numpy.typing.mypy_plugin,pydantic.mypy"
# Required because newer mypy versions (in base env) complain about the use of
# # type: ignore[comparison-overlap] but older versions (in dev env) require it.
disable_error_code = ["unused-ignore"] # Required because ne
exclude = [
  "presto/_version.py",
  "presto/tests/",
  "presto/metadynamics.py", # As mostly lifted from OpenMM
]

[tool.coverage.report]
exclude_lines = [
  "@overload",
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]

# -----------------------------
# Pixi configuration
# -----------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
name = "presto"
preview = ["pixi-build"]

[tool.pixi.package]
name = {workspace = true}

[tool.pixi.package.build-dependencies]
python = ">=3.11,<3.15"

[tool.pixi.package.host-dependencies]
hatchling = "*"

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.environments]
# Default is equivalent to gpu-py312-cuda129 (the py313 environment can be problematic as the Orb dep
# dm-tree has to be built. Only CUDA 12.9 as that's what OpenMM 8.5 supports.
default = { features = ["common", "gpu", "dev", "docs", "typing", "aceff", "aimnet", "ase", "mace", "orb", "py312", "cuda129"], solve-group = "gpu-py312-cuda129" }
gpu-py313-cuda129 = { features = ["common", "gpu", "dev", "docs", "typing", "aceff", "aimnet", "ase", "mace", "orb", "py313", "cuda129"] }
gpu-py312-cuda129 = { features = ["common", "gpu", "dev", "docs", "typing", "aceff", "aimnet", "ase", "mace", "orb", "py312", "cuda129"], solve-group = "gpu-py312-cuda129" }
# CPU
cpu-py312 = { features = ["common", "cpu", "dev", "docs", "typing", "aceff", "aimnet", "ase", "mace", "orb", "py312"] }
cpu-py313 = { features = ["common", "cpu", "dev", "docs", "typing", "aceff", "aimnet", "ase", "mace", "orb", "py313"] }

# Base (no MLPs). These mimic the conda-forge environments.
base-py312-cuda129 = { features = ["common", "gpu", "dev", "typing", "py312", "cuda129"] }
base-py313-cuda129 = { features = ["common", "gpu", "dev", "typing", "py313", "cuda129"] }
base-cpu-py312 = { features = ["common", "cpu", "dev", "typing", "py312"] }
base-cpu-py313 = { features = ["common", "cpu", "dev", "typing", "py313"] }

[tool.pixi.dependencies]
python = ">=3.11,<3.15"

# -----------------------------
# Python version features
# -----------------------------
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

# -----------------------------
# CUDA version features
# -----------------------------
[tool.pixi.feature.cuda129.system-requirements]
cuda = "12.9"

[tool.pixi.feature.cuda129.dependencies]
cuda-version = "12.9.*"
# Need dev headers for AceFF
cuda-cudart-dev = "12.9.*"
pytorch-gpu = ">=2.8.0"

# -----------------------------
# Shared dependencies
# -----------------------------
[tool.pixi.feature.common.dependencies]
pip = "*"
pyyaml = "*"
datasets = "*"
jupyter = "*"
nglview = "*"
"smirnoff-plugins" = ">=0.0.4"
"openff-toolkit" = ">=0.17.0"
"openff-units" = "*"
"openff-interchange" = ">=0.4.11" # Required for numpy 2.4 compatibility
"openff-forcefields" = ">=2026.01.0"
openmm-ml = ">=1.6"
tensorboardX = "*"
tensorboard = "*"
versioneer = "*"
rich = ">=14.3.1, <15"
"pydantic" = ">=2"
"pydantic-settings" = "*"
"pydantic-units"= "*"
loguru = "*"
h5py = "*"
seaborn = "*"
rdkit = ">=2024.03.6"
ambertools = "*"
mdtraj = "*"
openmm = ">=8.5.0"
smee-base = ">=0.17.0"
descent = ">=0.6.0"

# Install packages via pip: GitHub smee + mace-torch
[tool.pixi.feature.common.pypi-dependencies]
presto ={ path = ".", editable = true }

# -----------------------------
# GPU vs CPU toggle
# -----------------------------
[tool.pixi.feature.gpu.system-requirements]
cuda = "12"

[tool.pixi.feature.gpu.dependencies]
cuda-version = ">=12"
# cuequivariance="*"
# cuequivariance-torch="*"

# [tool.pixi.feature.gpu.pypi-dependencies]
# cuequivariance-ops-torch-cu12="*"

[tool.pixi.feature.cpu.dependencies]
pytorch = ">=2.8.0"

# -----------------------------
# Different ML potential options
# -----------------------------
# Need for different features as nnpoops pins torch to older versions. This causes resolution conflicts with openmm-torch (which pins a specific build).
[tool.pixi.feature.aceff.dependencies]
# 3.0.3 has 3x speedup
torchmd-net = ">=3.0.3"
# Warp-lang >= 1.12 incompatible with nvalchemi-toolkit-ops
warp-lang = "==1.11.1"

[tool.pixi.feature.aimnet.dependencies]
# Warp-lang >= 1.12 incompatible with nvalchemi-toolkit-ops
warp-lang = "==1.11.1"

[tool.pixi.feature.aimnet.pypi-dependencies]
aimnet = ">=0.1.0"
# aimnet doesn't like more recent versions but doesn't specify an upper bound...
nvalchemi-toolkit-ops = "==0.2.0"

[tool.pixi.feature.mace.pypi-dependencies]
mace-torch = "*"

[tool.pixi.feature.ase.dependencies]
ase = "*"

[tool.pixi.feature.orb.pypi-dependencies]
orb-models = ">=0.5.5"
# Pixi doesn't seem to detect the
# Current annoyance is https://github.com/allenai/cached_path/issues/263 -- cached-path does
# not allow new rich versions, though they should work fine. To get round this, install directly
# from fork on GitHub which allows newer rich versions.
cached-path = { git = "https://github.com/fjclark/cached_path.git", rev = "1cb8bdecd22e3af70182b8075bc86d7c18184c9e" }

# -----------------------------
# Dev/test tools
# -----------------------------
[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
ruff = "*"
pytest = "*"
pytest-mock = "*"
pytest-cov = "*"
codecov = "*"
mypy = "*"
hypothesis = "*"
ipdb = "*"

# -----------------------------
# Documentation
# -----------------------------
[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
"mkdocs-material" = "*"
"mkdocs-gen-files" = "*"
"mkdocs-literate-nav" = "*"
"mkdocs-jupyter" = "*"
mkdocstrings = "*"
"mkdocstrings-python" = "*"
black = "*"
mike = "*"
"griffe-pydantic" = "*"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs-bibtex = "*"

# -----------------------------
# Typing stubs
# -----------------------------
[tool.pixi.feature.typing.pypi-dependencies]
"types-colorama" = "*"
"types-decorator" = "*"
"types-defusedxml" = "*"
"types-docutils" = "*"
"types-greenlet" = "*"
"types-jsonschema" = "*"
"types-networkx" = "*"
"types-openpyxl" = "*"
"types-pexpect" = "*"
"types-protobuf" = "*"
"types-Pygments" = "*"
"types-python-dateutil" = "*"
"types-pytz" = "*"
"types-PyYAML" = "*"
"types-requests" = "*"
"types-tabulate" = "*"
"pandas-stubs" = "*"
"types-cachetools" = "*"

# -----------------------------
# Tasks (run in proper environment/feature context)
# -----------------------------
[tool.pixi.tasks]
install-pre-commit = { cmd = "pre-commit install" }

# Linting requires dev
lint = { cmd = "ruff check presto" }
format = { cmd = "ruff format presto && ruff check --fix --select I presto" }

# Testing requires dev + common + GPU/CPU
test = { cmd = "pytest -v --cov=presto --cov-report=term --cov-report=xml --junitxml=unit.xml --color=yes -m 'not slow' presto/tests" }
"test-slow" = { cmd = "pytest -v --cov=presto --cov-report=term --cov-report=xml --junitxml=unit.xml --color=yes -m slow presto/tests" }
"test-unit" = { cmd = "pytest -v --cov=presto --cov-report=term --cov-report=xml --junitxml=unit.xml --color=yes -m 'not slow' presto/tests/unit" }
"test-unit-slow" = { cmd = "pytest -v --cov=presto --cov-report=term --cov-report=xml --junitxml=unit.xml --color=yes -m slow presto/tests/unit" }
"test-integration" = { cmd = "pytest -v --cov=presto --cov-report=term --cov-report=xml --junitxml=unit.xml --color=yes -m 'not slow' presto/tests/integration" }
type-check = { cmd = "mypy --follow-imports=silent --ignore-missing-imports --strict presto" }
# Docs tasks require docs feature
"docs-build" = { cmd = "mkdocs build" }
"docs-serve" = { cmd = "mkdocs serve" }
"docs-deploy" = { cmd = "mike deploy --push --update-aliases $VERSION" }
"rerun-notebooks" = { cmd = "jupyter nbconvert --to notebook --execute --inplace examples/*.ipynb" }

# Container tasks. These shell out to docker and so do not need a pixi environment
# themselves, but keep the long incantations in one place.
"container-build" = { cmd = "docker build --build-arg PRESTO_VERSION=$(git describe --tags --always | sed 's/-/.post/' | sed 's/-g/+g/') -t presto:local ." }
# Extra arguments are appended, e.g. `pixi run container-run presto train --help`.
"container-run" = { cmd = "docker run --rm --gpus all --shm-size=1g --user $(id -u):$(id -g) -v $PWD:/work -v presto-cache:/cache presto:local" }
"container-shell" = { cmd = "docker run --rm -it -v $PWD:/work -v presto-cache:/cache --entrypoint bash presto:local" }

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (excluded from default test tasks)",
]
