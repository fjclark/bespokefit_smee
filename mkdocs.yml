site_name: "presto"
site_description: "Generate a Bespoke Force-Field Parametrization Quickly and Reliably"
site_url: "https://github.com/cole-group/presto"
repo_url: "https://github.com/cole-group/presto"
site_dir: "site"
watch: [mkdocs.yml, README.md, presto/, docs]
copyright: Copyright &copy; 2025 Thomas James Pope, Finlay Clark
edit_uri: edit/main/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

exclude_docs: |
  examples/README.md
  how-to/use-precomputed-dataset.md

extra:
  version:
    provider: mike

nav:
- Home: index.md
- Get started:
  - get-started/index.md
  - Installation: get-started/installation.md
  - Run with containers: get-started/containers.md
  - Quickstart: get-started/quickstart.md
  - Walk-through (CLI): examples/basic-walk-through-cli.ipynb
  - Walk-through (Python API): examples/basic-walk-through-python-api.ipynb
- How-to:
  - how-to/index.md
  - Fit a single molecule: how-to/fit-single-molecule.md
  - Fit a congeneric series: how-to/fit-congeneric-series.md
  - Use SDF inputs: how-to/use-sdf-inputs.md
  - Use custom charges: how-to/use-custom-charges.md
  - Clean and rerun a fit: how-to/clean-rerun.md
  - Choose an MLP: how-to/choose-an-mlp.md
  - Use an ASE calculator: how-to/use-ase-calculator.md
  - Speed up fitting with parallelism: how-to/speed-up-with-parallelism.md
  - Inspect outputs and plots: how-to/inspect-outputs.md
  - Run from Python: how-to/run-from-python.md
- Concepts:
  - concepts/index.md
  - Bespoke SMIRNOFF in 5 minutes: concepts/bespoke-smirnoff-primer.md
  - Method overview: concepts/method-overview.md
  - Sampling protocols: concepts/sampling-protocols.md
  - Type generation and SMIRKS specificity: concepts/type-generation.md
  - MLPs in presto: concepts/mlps.md
  - Output directory layout: concepts/output-layout.md
- Reference:
  - reference/index.md
  - Troubleshooting: reference/troubleshooting.md
  - Glossary: reference/glossary.md
  - API: reference/api/
- Development:
  - development/index.md
  - Contributing: development/contributing.md
  - Building the docs: development/docs.md
  - Releasing: development/releasing.md
- Citing presto: citing.md
- Changelog: changelog.md

theme:
  name: material
  features:
  - announce.dismiss
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: deep-purple
    accent: red
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: deep-purple
    accent: red
    toggle:
      icon: material/weather-night
      name: Switch to light mode

markdown_extensions:
- attr_list
- md_in_html
- def_list
- admonition
- footnotes
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.magiclink
- pymdownx.snippets:
    check_paths: true
- pymdownx.details
- pymdownx.arithmatex:
    generic: true
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: "#"

plugins:
- autorefs
- search
- gen-files:
    scripts:
    - docs/scripts/gen_ref_pages.py
- literate-nav:
    nav_file: SUMMARY.md
    implicit_index: true
- mkdocs-jupyter:
    include: [ "examples/*.ipynb" ]
- mkdocstrings:
    handlers:
      python:
        paths: [presto/]
        options:
          docstring_style: numpy
          docstring_options:
            ignore_init_summary: true
          docstring_section_style: list
          filters:
            - "!^tests"
            - "!^data"
          heading_level: 1
          inherited_members: true
          merge_init_into_class: true
          separate_signature: true
          show_root_heading: true
          show_root_full_path: false
          show_signature_annotations: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_if_no_docstring: false
          signature_crossrefs: true
          summary: true
          members_order: source
          extensions:
            - griffe_pydantic:
                schema: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
